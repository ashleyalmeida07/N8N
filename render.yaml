services:
  - type: web
    name: n8n-meme-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: N8N_HOST
        value: 0.0.0.0
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      - key: N8N_SECURE_COOKIE
        value: false
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 1
